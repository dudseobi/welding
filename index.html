<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="euc-kr">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL 이동</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f5f5;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 500px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #0078d4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #106ebe;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>웹페이지 이동</h2>

    <input
        type="text"
        id="urlInput"
        placeholder="https://www.naver.com">

    <button onclick="goUrl()">연결하기</button>
</div>

<script>
function goUrl() {
    let url = document.getElementById("urlInput").value.trim();

    if (!url) {
        alert("URL을 입력하세요.");
        return;
    }

    if (!url.startsWith("http://") && !url.startsWith("https://")) {
        url = "https://" + url;
    }

    window.location.href = url;
}
</script>

</body>
</html>
